name: CI - Attack Chain Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 攻击链集成测试 (无 Docker, 纯 Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install flask==3.0.3 requests==2.32.3 lxml pymysql

      - name: 运行全链路攻击测试
        run: python3 scripts/test_all.py

      - name: 校验应用启动与教学面板
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'web')
          import app
          app.db_init()
          client = app.APP.test_client()
          r = client.get('/debug_info')
          assert r.status_code == 200, 'debug_info 失败'
          assert b'flag1' in r.data, '缺少flag1'
          r = client.get('/lab')
          assert b'BIOHAZARD' in r.data.upper(), '教学面板 /lab 异常'
          print('OK: 应用启动 + debug_info + /lab 教学面板 正常')
          PY
